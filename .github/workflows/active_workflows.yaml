
name: Run selected experiment

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Module trong experiments/ theo cấu trúc subfolder"
        required: true
        default: data.check
        type: choice
        options:
          - data.check
          - modeling.baseline
      config:
        description: "Config đầy đủ; bỏ trống dùng mặc định của task"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout selected workflow ref
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Adult dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: adult-raw-v1

      - name: Run experiment
        env:
          TASK: ${{ inputs.task }}
          CONFIG: ${{ inputs.config }}
        run: |
          if [ -z "$CONFIG" ]; then
            CONFIG=$(python -m src.common.config "$TASK")
          fi
          echo "RESULT_NAME=$(basename "$CONFIG" .json)" >> "$GITHUB_ENV"
          python -m "experiments.${TASK}" --config "$CONFIG"

      - name: Upload results
        if: always() && env.RESULT_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_NAME }}-${{ github.run_number }}
          path: results/${{ env.RESULT_NAME }}/
          if-no-files-found: warn
