
name: Run experiment

"on":
  # push trigger works on non-default branches, so main does not need this file
  push:
    branches:
      - Thuy-branch
    paths:
      - "src/**"
      - "experiments/**"
      - "configs/**"
      - "requirements.txt"
      - ".github/workflows/run-experiment.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "Module trong experiments/ (vd: data_check, baseline)"
        required: true
        default: data_check
        type: choice
        options:
          - data_check
          - baseline
      config:
        description: "Đường dẫn config (để trống = configs/<task>.json)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # push: run all listed tasks; manual run: only the chosen task
        task: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.task) || '["data_check", "baseline"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Adult dataset
        uses: actions/cache@v4
        with:
          path: data/raw
          key: adult-raw-v1

      - name: Run ${{ matrix.task }}
        env:
          TASK: ${{ matrix.task }}
          CONFIG: ${{ inputs.config }}
        run: |
          if [ -z "$CONFIG" ]; then
            CONFIG="configs/${TASK}.json"
          fi
          python -m "experiments.${TASK}" --config "$CONFIG"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.task }}-${{ github.run_number }}
          path: results/${{ matrix.task }}/
          if-no-files-found: warn
